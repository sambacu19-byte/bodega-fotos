<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bodega · Catálogo de carrocería con fotos</title>
<meta name="theme-color" content="#0f1318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318; --panel:#171d25; --panel2:#202833; --line:#2b3542;
  --text:#e8ecf1; --mute:#8d99a8; --steel:#5b6878;
  --tape:#f5c518; --tape-ink:#171300; --wa:#25d366; --fb:#4c8dff; --bad:#ff6b5e;
  --cond:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-padding-top:170px}
body{
  background:radial-gradient(1100px 480px at 88% -8%,#1c2836 0%,transparent 62%),var(--bg);
  color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* ---------- Encabezado ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  max-width:1280px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 4px}
.brand{display:flex;gap:12px;align-items:stretch;padding-bottom:8px}
.brand::before{content:"";width:8px;background:var(--tape);border-radius:2px;flex:none}
.wordmark{font:700 clamp(36px,5vw,52px)/.9 var(--cond);letter-spacing:.01em}
.tag{display:block;margin-top:10px;font:500 15px/1.35 var(--body);color:var(--mute);max-width:30ch}
.car{width:min(30vw,260px);height:auto;flex:none;opacity:.85}
.car .body{fill:none;stroke:url(#sheen);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.car .glow{fill:var(--tape);opacity:.9;filter:drop-shadow(0 0 6px rgba(245,197,24,.9))}
.car .tail{fill:var(--bad);opacity:.8}
.car .ground{stroke:var(--line);stroke-width:2}

/* ---------- Barra de búsqueda ---------- */
.bar{position:sticky;top:0;z-index:20;padding:12px 0 10px;
  background:linear-gradient(var(--bg) 82%,rgba(15,19,24,0));backdrop-filter:blur(6px)}
.search{position:relative}
.search input{width:100%;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--panel);
  font:500 18px var(--body);padding:0 56px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--mute);font-weight:400}
.search input:focus{outline:none;border-color:var(--tape);box-shadow:0 0 0 4px rgba(245,197,24,.16)}
.search .lens{position:absolute;left:18px;top:18px;width:22px;height:22px;color:var(--mute);pointer-events:none}
.search .clear{position:absolute;right:8px;top:9px;width:40px;height:40px;border:0;border-radius:8px;
  background:transparent;color:var(--mute);font-size:24px;line-height:1}
.search .clear:hover{background:var(--panel2);color:var(--text)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);font:600 14px var(--body);white-space:nowrap}
.chip:hover{border-color:var(--steel)}
.chip[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.sep{flex:none;width:1px;background:var(--line);margin:6px 2px}

/* ---------- Resumen ---------- */
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  color:var(--mute);font-size:14px;padding:14px 0 12px}
.meta b{color:var(--text);font-weight:600}
.edit-btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--body)}
.edit-btn[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.notice{background:#3a2a05;border:1px solid #7a5a10;color:#ffd978;border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px}
.did{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ph{position:relative;display:block;width:100%;aspect-ratio:4/3;padding:0;border:0;
  background:linear-gradient(135deg,#1d2733,#11161d);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.ph .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--steel);font-size:14px}
.ph .empty svg{width:46px;height:46px}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(8,11,15,.78);border-radius:999px;padding:2px 10px;font:600 12px var(--body)}
.info{flex:1;padding:12px 14px 6px}
.info h3{font:600 18px/1.18 var(--cond);letter-spacing:.015em;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.code{margin-top:8px;font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--steel);overflow-wrap:anywhere}
.loc{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:500 12px/1.2 var(--body);color:var(--mute)}
.loc svg{width:12px;height:12px;flex:none;color:var(--tape)}
mark{background:rgba(245,197,24,.28);color:#fff;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:8px;padding:8px 12px 12px}
.acts .btn{height:36px}
.acts .btn span{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 8px;
  border-radius:9px;border:1px solid var(--line);background:var(--panel2);font:600 13px var(--body);flex:1;min-width:0;white-space:nowrap;
  text-decoration:none;color:var(--text);transition:background .15s,border-color .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{color:var(--wa);border-color:rgba(37,211,102,.45);background:rgba(37,211,102,.08)}
.btn.wa:hover{background:rgba(37,211,102,.18)}
.btn.fb{color:var(--fb);border-color:rgba(76,141,255,.5);background:rgba(76,141,255,.08)}
.btn.fb:hover{background:rgba(76,141,255,.18)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn.tape:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:rgba(255,107,94,.5);background:rgba(255,107,94,.08)}
.btn.danger:hover{background:rgba(255,107,94,.18)}
.btn[aria-disabled="true"]{opacity:.38;filter:grayscale(.6)}
.more[hidden]{display:none}
.more{display:block;margin:22px auto 40px;height:46px;padding:0 24px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.empty-state{padding:56px 10px;text-align:center;color:var(--mute)}
.empty-state h2{font:600 28px var(--cond);color:var(--text);margin-bottom:6px}

/* ---------- Visor ---------- */
dialog{border:0;padding:0;margin:auto;background:transparent;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgba(5,8,12,.8);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(1040px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
@media(max-width:780px){.sheet{grid-template-columns:1fr}}
.stage{background:#0a0d11;display:flex;flex-direction:column;min-width:0}
.big{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.big img{width:100%;height:100%;object-fit:contain}
.big .none{color:var(--mute);text-align:center;padding:20px}
.nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(8,11,15,.7);font-size:22px}
.nav:hover{background:rgba(8,11,15,.92)}
.nav.prev{left:10px}.nav.next{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px}
.thumbs button{flex:none;width:68px;height:52px;border-radius:7px;overflow:hidden;border:2px solid transparent;padding:0;background:#161c24}
.thumbs button[aria-current="true"]{border-color:var(--tape)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.side{padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h2{font:600 28px/1.1 var(--cond);letter-spacing:.015em;padding-right:44px;overflow-wrap:anywhere}
.x{position:absolute;right:10px;top:10px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:rgba(8,11,15,.8);font-size:22px;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{height:46px}
.editor{margin-top:auto;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.editor p{font-size:14px;color:var(--mute)}
.editor .btn{flex:none;height:46px}
.progress{font-size:14px;color:var(--tape);min-height:20px}
.pin-box{width:min(380px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.pin-box h2{font:600 26px var(--cond)}
.pin-box input{height:50px;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:20px;letter-spacing:.2em}
.pin-box input:focus{outline:none;border-color:var(--tape)}
.pin-err{color:var(--bad);font-size:14px;min-height:18px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));translate:-50% 20px;opacity:0;pointer-events:none;
  background:#e8ecf1;color:#10151b;padding:12px 18px;border-radius:10px;font-weight:600;z-index:100;max-width:calc(100vw - 32px);
  transition:opacity .2s,translate .2s}
#toast.on{opacity:1;translate:-50% 0}

@media(max-width:640px){
  .wrap,.top{padding-left:14px;padding-right:14px}
  .car{width:34vw;opacity:.7}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .info{padding:10px 10px 4px}.info h3{font-size:16px}
  .acts{padding:8px 8px 10px;gap:6px}
  .btn{padding:0 6px;font-size:13px;gap:5px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>

</header>

<div class="bar">
  <div class="wrap">

<main class="wrap">

<dialog id="viewer" aria-label="Fotos del producto">

    <div class="side">

      <p class="code" id="vCode" style="margin:0"></p>
      <div class="row">

        <button class="btn fb" id="vFb"></button>
      </div>
      <div class="editor" id="vEditor" hidden>
        <p id="vCount"></p>
        <label class="btn tape" id="vAdd" style="cursor:pointer">+ Agregar fotos
          <input type="file" id="vFile" accept="image/*" multiple hidden>
        </label>
        <button class="btn danger" id="vDel">Quitar esta foto</button>
        <div class="progress" id="vProg" aria-live="polite"></div>
      </div>
    </div>
  </div>
</dialog>

<dialog id="pinDlg" aria-label="Entrar al modo editor">

    <p style="color:var(--mute);font-size:15px">Escribe el PIN para agregar o quitar fotos.</p>

    <div class="pin-err" id="pinErr" aria-live="polite"></div>
    <div class="row">
      <button class="btn tape" id="pinOk">Entrar</button>
      <button class="btn" id="pinNo">Cancelar</button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>

let PIN = ''; try { PIN = sessionStorage.getItem('bodega_pin') || ''; } catch (e) {}
async function apiGet(params) {
  if (!API_URL) throw new Error('Falta API_URL');
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function apiPost(action, payload = {}) {
  if (!API_URL) throw new Error('Falta API_URL');
  // text/plain evita el preflight de CORS, que Apps Script no responde
  const r = await fetch(API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, pin: PIN, ...payload })
  });
  return r.json();
}
const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const direct = id => `https://lh3.googleusercontent.com/d/${id}=w1600`;

let PHOTOS = {};
try { PHOTOS = JSON.parse(localStorage.getItem('bodega_fotos_v1') || '{}'); } catch (e) {}
const savePhotosCache = () => { try { localStorage.setItem('bodega_fotos_v1', JSON.stringify(PHOTOS)); } catch (e) {} };
const fotosDe = it => PHOTOS[it.c] || [];
const hasFoto = it => fotosDe(it).length > 0;

/* ----------------------------------------------------------------------
   Buscador inteligente
   - sin acentos ni mayúsculas, todas las palabras deben coincidir
   - prefijos mientras escribes, tolerancia a errores de ortografía
   - sinónimos de carrocería (parachoques = bumper, cofre = capó…)
   - el año encaja con rangos: "2018" encuentra "2015-2020" y "2018-"
   - también busca por código de producto
---------------------------------------------------------------------- */
const SYN = [
  ['farol','faro','luz','lampara'], ['stop','calavera','piloto'],
  ['bumper','parachoques','parachoque','defensa','fascia'],
  ['guardafango','salpicadera','fender','guardabarro'], ['retrovisor','espejo'],
  ['capo','cofre','capot'], ['parrilla','rejilla','mascara'],
  ['halogena','neblinero','antiniebla','niebla'], ['ventiladora','ventilador','abanico'],
  ['condensador','condensor'], ['manecilla','manija','agarradera'],
  ['pechera','trompa'], ['tolva','guardalodo','guardapolvo'], ['tapon','tapa']
];
const SYNMAP = {};
SYN.forEach(g => g.forEach(w => { SYNMAP[w] = SYNMAP[w] || new Set(); g.forEach(x => { if (x !== w) SYNMAP[w].add(x); }); }));

let DATA = [], IDX = [], VOCAB = new Set(), CATS = [];
function buildIndex() {
  VOCAB = new Set();
  const catCount = {};
  IDX = DATA.map((p, i) => {
    const nd = nk(p.d), nc = nk(p.c);
    const toks = splitTok(nd);
    toks.forEach(w => { if (w.length >= 3 && !/\d/.test(w)) VOCAB.add(w); });
    const years = []; const re = /((?:19|20)\d{2})(?!\d)(\s*-\s*((?:19|20)\d{2})(?!\d))?/g; let m;
    while ((m = re.exec(nd))) {
      if (m.index > 0 && /\d/.test(nd[m.index - 1])) continue;
      const a = +m[1]; const open = nd.slice(m.index + m[1].length).match(/^\s*-/);
      years.push([a, m[3] ? +m[3] : (open ? 2030 : a)]);
    }
    const cat = toks[0] || '';
    if (cat.length >= 4 && !/\d/.test(cat)) catCount[cat] = (catCount[cat] || 0) + 1;
    return { i, c: p.c, d: p.d, u: p.u, nu: nk(p.u || ''), nd, nc: nc.replace(/[^a-z0-9]/g, ''), toks, years, cat };
  });
  CATS = Object.entries(catCount).sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);
}

function lev(a, b, max) {
  if (a === b) return 0;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > max) return max + 1;
  let prev = Array.from({ length: lb + 1 }, (_, j) => j);
  for (let i = 1; i <= la; i++) {
    const cur = [i]; let rowMin = i;
    for (let j = 1; j <= lb; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur[j] = v; if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[lb];
}

function tokScore(it, t) {
  let best = 0;
  if (/^(19|20)\d{2}$/.test(t)) {
    const y = +t;
    if (it.years.some(r => y >= r[0] && y <= r[1])) best = 9;
  }
  for (const w of it.toks) {
    if (w === t) return 10;
    if (w.startsWith(t)) best = Math.max(best, t.length >= 2 ? 7 : 5);
    else if (t.length >= 3 && w.includes(t)) best = Math.max(best, 4);
  }
  if (t.length >= 3 && it.nc.includes(t)) best = Math.max(best, 8);
  if (/\d/.test(t) && it.nu && it.nu.replace(/[^a-z0-9]/g, '').includes(t)) best = Math.max(best, 8);
  const sy = SYNMAP[t];
  if (sy) for (const s of sy) { if (it.toks.some(w => w === s || w.startsWith(s))) { best = Math.max(best, 8); break; } }
  if (best < 4 && t.length >= 4 && !/\d/.test(t)) {
    const max = t.length >= 8 ? 2 : 1;
    for (const w of it.toks) { if (lev(w, t, max) <= max) { best = Math.max(best, 3); break; } }
  }
  return best;
}
function scoreItem(it, qt, any) {
  let total = 0;
  for (const t of qt) {
    const s = tokScore(it, t);
    if (s <= 0) { if (any) continue; return 0; }
    total += s;
  }
  if (qt.length > 1 && it.nd.includes(qt.join(' '))) total += 6;
  return total;
}
function hasWordStart(t) { for (const w of VOCAB) if (w.startsWith(t)) return true; return false; }
function didYouMean(qt) {
  let changed = false;
  const out = qt.map(t => {
    if (/\d/.test(t) || t.length < 4 || hasWordStart(t)) return t;
    const mx = t.length >= 7 ? 2 : 1;
    let best = t, bd = mx + 1;
    for (const w of VOCAB) {
      if (Math.abs(w.length - t.length) > mx) continue;
      const d = lev(w, t, mx);
      if (d < bd) { bd = d; best = w; if (d === 1) break; }
    }
    if (best !== t) changed = true;
    return best;
  });
  return changed ? out.join(' ') : null;
}

/* ----------------------------------------------------------------------
   Estado y pintado
---------------------------------------------------------------------- */
const state = { q: '', foto: 'todos', cat: '' };
let LIST = [], QT = [], shown = 0, EDIT = !!PIN;
const PAGE = 48;
const grid = $('#grid');

function compute() {
  QT = splitTok(nk(state.q));
  const base = IDX.filter(it =>
    (!state.cat || it.cat === state.cat) &&
    (state.foto === 'todos' || (state.foto === 'con' ? hasFoto(it) : !hasFoto(it))));
  if (!QT.length) { LIST = base; $('#did').innerHTML = ''; return false; }
  let sc = [], partial = false;
  for (const it of base) { const s = scoreItem(it, QT, false); if (s > 0) sc.push([s, it]); }
  if (!sc.length && QT.length > 1) {
    partial = true;
    for (const it of base) { const s = scoreItem(it, QT, true); if (s > 0) sc.push([s, it]); }
  }
  sc.sort((a, b) => (b[0] - a[0]) || (Number(hasFoto(b[1])) - Number(hasFoto(a[1]))) || (a[1].i - b[1].i));
  LIST = sc.map(x => x[1]);
  return partial;
}

function hl(it) {
  const d = it.d;
  if (!QT.length) return esc(d);
  const terms = new Set();
  QT.forEach(t => {
    if (t.length < 2 || /^(19|20)\d{2}$/.test(t)) return;
    terms.add(t); (SYNMAP[t] || []).forEach(s => terms.add(s));
  });
  const marks = new Array(d.length).fill(false);
  terms.forEach(t => {
    let p = 0;
    while ((p = it.nd.indexOf(t, p)) > -1) {
      if (p === 0 || !/[a-z0-9]/.test(it.nd[p - 1])) for (let k = p; k < p + t.length; k++) marks[k] = true;
      p += t.length;
    }
  });
  let out = '', cur = false, buf = '';
  for (let k = 0; k < d.length; k++) {
    if (marks[k] !== cur) { out += cur ? '<mark>' + esc(buf) + '</mark>' : esc(buf); buf = ''; cur = marks[k]; }
    buf += d[k];
  }
  return out + (cur ? '<mark>' + esc(buf) + '</mark>' : esc(buf));
}

function card(it) {
  const f = fotosDe(it), ok = f.length > 0;
  const ph = ok
    ? `<img loading="lazy" decoding="async" src="${thumb(f[0], 520)}" alt="">`
    : `<span class="empty">${ICON_IMG}<span>${EDIT ? 'Toca para agregar foto' : 'Sin foto todavía'}</span></span>`;
  return `<article class="card" data-i="${it.i}">
    <button class="ph" data-act="open" aria-label="Ver fotos: ${esc(it.d)}">${ph}${EDIT ? `<span class="cnt">${f.length}/${MAX_FOTOS}</span>` : (f.length > 1 ? `<span class="cnt">${f.length} fotos</span>` : '')}</button>
    <div class="info"><h3>${hl(it)}</h3>${it.u ? `<span class="loc">${ICON_PIN}${esc(it.u)}</span>` : ''}<p class="code">${esc(it.c)}</p></div>
    <div class="acts">
      <button class="btn wa" data-act="wa" aria-label="Compartir foto por WhatsApp" ${ok ? '' : 'aria-disabled="true" title="Este producto aún no tiene foto"'}>${BTN_WA}</button>
      <button class="btn fb" data-act="fb" aria-label="Compartir foto por Facebook" ${ok ? '' : 'aria-disabled="true" title="Este producto aún no tiene foto"'}>${BTN_FB}</button>
    </div>
  </article>`;
}

function renderMore(reset) {
  if (reset) { grid.innerHTML = ''; shown = 0; }
  const next = LIST.slice(shown, shown + PAGE);
  grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
  shown += next.length;
  $('#more').hidden = shown >= LIST.length;
}

function refresh() {
  const partial = compute();
  const con = IDX.filter(hasFoto).length;
  $('#count').innerHTML = `<b>${LIST.length.toLocaleString('es')}</b> de ${IDX.length.toLocaleString('es')} productos · ${con.toLocaleString('es')} con foto` +
    (partial ? ' · coincidencias parciales' : '');
  $('#clear').hidden = !state.q;
  renderMore(true);
  if (!LIST.length) {
    const alt = QT.length ? didYouMean(QT) : null;
    $('#did').innerHTML = `<div class="empty-state"><h2>No encontramos ese producto</h2>
      <p>Prueba con menos palabras, o con el año del vehículo.</p>
      ${alt ? `<p style="margin-top:14px"><button class="chip" data-fix="${esc(alt)}">¿Quisiste decir «${esc(alt)}»?</button></p>` : ''}</div>`;
  } else $('#did').innerHTML = '';
}

function buildFilters() {
  const mk = (label, key, val) => `<button class="chip" data-f="${key}" data-v="${val}" aria-pressed="${state[key] === val}">${label}</button>`;
  $('#filters').innerHTML =
    mk('Todos', 'foto', 'todos') + mk('Con foto', 'foto', 'con') + mk('Sin foto', 'foto', 'sin') +
    '<span class="sep"></span>' + mk('Todas las piezas', 'cat', '') +
    CATS.map(c => mk(c.charAt(0).toUpperCase() + c.slice(1), 'cat', c)).join('');
}

/* ----------------------------------------------------------------------
   Compartir: solo la foto y la descripción
   - Celular: abre el menú nativo con la foto real adjunta (elige WhatsApp o Facebook)
   - Computadora: WhatsApp Web con la descripción + enlace a la foto;
     Facebook con el enlace a la foto
---------------------------------------------------------------------- */
const BLOBS = new Map();
function getPhotoBlob(id) {
  if (BLOBS.has(id)) return BLOBS.get(id);
  const p = (async () => {
    try {
      const r = await fetch(thumb(id, 1200));
      if (!r.ok) throw 0;
      const b = await r.blob();
      if (!b.type.startsWith('image/')) throw 0;
      return b;
    } catch (e) {
      const j = await apiGet({ action: 'img', id });
      if (!j.ok) throw new Error('img');
      const bin = atob(j.data), u = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      return new Blob([u], { type: j.mime || 'image/jpeg' });
    }
  })();
  BLOBS.set(id, p);
  p.catch(() => BLOBS.delete(id));
  return p;
}
async function share(it, via, id) {
  if (!id) { toast('Este producto aún no tiene foto'); return; }
  const text = it.d;
  try {
    const blob = await getPhotoBlob(id);
    const file = new File([blob], it.c.replace(/[^\w-]/g, '_') + '.jpg', { type: blob.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
      return;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const link = direct(id);
  const url = via === 'wa'
    ? 'https://wa.me/?text=' + encodeURIComponent(text + '\n' + link)
    : 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) + '&quote=' + encodeURIComponent(text);
  window.open(url, '_blank', 'noopener');
}

const vw = $('#viewer');

function openViewer(it) { cur = it; curN = 0; drawViewer(); if (!vw.open) vw.showModal(); }

    : `<div class="none">${EDIT ? 'Este producto no tiene fotos. Agrega la primera.' : 'Este producto aún no tiene fotos.'}</div>`;
  $('#vThumbs').innerHTML = f.length > 1
    ? f.map((id, k) => `<button data-k="${k}" aria-current="${k === curN}" aria-label="Foto ${k + 1}"><img loading="lazy" src="${thumb(id, 160)}" alt=""></button>`).join('') : '';
  $('#vWa').innerHTML = BTN_WA; $('#vFb').innerHTML = BTN_FB;

$('#vBig').addEventListener('click', e => {

});
$('#vThumbs').addEventListener('click', e => {

});
vw.addEventListener('keydown', e => {

  if (e.key === 'ArrowRight') { curN = (curN + 1) % f.length; drawViewer(); }

});

vw.addEventListener('click', e => { if (e.target === vw) vw.close(); });
vw.addEventListener('close', () => { refresh(); });

$('#vFb').addEventListener('click', () => share(cur, 'fb', fotosDe(cur)[curN]));

// Reduce y comprime la foto en el celular antes de subirla (más rápido y gasta menos espacio)
async function compress(file, max = 1400, q = 0.82) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
  return { b64, mime: 'image/jpeg' };
}
$('#vFile').addEventListener('change', async e => {
  let files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const left = MAX_FOTOS - fotosDe(cur).length;
  if (left <= 0) { toast(`Máximo ${MAX_FOTOS} fotos por producto`); return; }
  if (files.length > left) { toast(`Solo caben ${left} más: máximo ${MAX_FOTOS} fotos por producto`, 4000); files = files.slice(0, left); }
  const prog = $('#vProg'); let okN = 0;
  for (let k = 0; k < files.length; k++) {
    prog.textContent = `Subiendo foto ${k + 1} de ${files.length}…`;
    try {
      const { b64, mime } = await compress(files[k]);
      const r = await apiPost('upload', { codigo: cur.c, data: b64, mime });
      if (!r.ok) throw new Error(r.error || 'Error');
      (PHOTOS[cur.c] = PHOTOS[cur.c] || []).push(r.id); okN++;
      curN = PHOTOS[cur.c].length - 1; savePhotosCache(); drawViewer();
    } catch (err) { toast('No se pudo subir: ' + err.message, 4500); break; }
  }
  prog.textContent = okN ? `Listo: ${okN} foto${okN > 1 ? 's' : ''} guardada${okN > 1 ? 's' : ''} en la nube.` : '';
});
$('#vDel').addEventListener('click', async () => {
  const f = fotosDe(cur); const id = f[curN]; if (!id) return;
  if (!confirm('¿Quitar esta foto del producto? Se borra de la nube.')) return;
  $('#vProg').textContent = 'Quitando foto…';
  try {
    const r = await apiPost('delete', { id });
    if (!r.ok) throw new Error(r.error || 'Error');
    PHOTOS[cur.c] = f.filter(x => x !== id);
    if (!PHOTOS[cur.c].length) delete PHOTOS[cur.c];
    BLOBS.delete(id); savePhotosCache(); drawViewer();
    $('#vProg').textContent = 'Foto quitada.';
  } catch (err) { $('#vProg').textContent = ''; toast('No se pudo quitar: ' + err.message, 4500); }
});

/* ----------------------------------------------------------------------
   Sincronización con la nube
---------------------------------------------------------------------- */
async function sync() {
  const s = $('#sync');
  if (!API_URL) {
    $('#notice').innerHTML = '<div class="notice">Falta conectar la nube: pega la URL de tu Apps Script en <b>API_URL</b> (arriba en el código). Mientras tanto solo se ve el catálogo.</div>';
    return;
  }
  s.textContent = 'Actualizando fotos…';
  try {
    const j = await apiGet({ action: 'list' });
    if (!j.ok) throw new Error(j.error);
    PHOTOS = j.fotos || {}; savePhotosCache();
    s.textContent = '';
    refresh();
  } catch (e) { s.textContent = 'Sin conexión con la nube'; }
  // catálogo en vivo desde tu hoja PRODUCTOS
  try {
    const j = await apiGet({ action: 'productos' });
    if (j.ok && j.productos && j.productos.length) {
      const a = j.productos, b = PRODUCTOS;
      const same = a.length === b.length && a.every((x, i) => x[0] === b[i][0] && x[1] === b[i][1] && (x[2] || '') === (b[i][2] || ''));
      if (!same) { DATA = a.map(([c, d, u]) => ({ c, d, u: u || '' })); buildIndex(); buildFilters(); refresh(); }
    }
  } catch (e) { /* si falla, seguimos con el catálogo incluido */ }
}

/* ---------- Arranque ---------- */
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { $('#sw1').remove(); $('#sw2').remove(); }
DATA = PRODUCTOS.map(([c, d, u]) => ({ c, d, u: u || '' }));
buildIndex(); buildFilters();
if (EDIT) { $('#editBtn').setAttribute('aria-pressed', 'true'); $('#editBtn').textContent = 'Terminar edición'; }
refresh(); sync();
</script>
</body>
</html>
